<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transaction Pipeline Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800">
    <main class="max-w-5xl mx-auto p-6 space-y-6">
      <header class="bg-white rounded-xl shadow p-6">
        <h1 class="text-2xl font-bold">Transaction Pipeline Dashboard</h1>
        <p class="text-sm text-slate-600 mt-2">
          Upload a CSV, track processing status, and fetch results from the FastAPI job endpoints.
        </p>
      </header>

      <section class="bg-white rounded-xl shadow p-6 space-y-4">
        <h2 class="text-lg font-semibold">1) Upload CSV</h2>
        <form id="uploadForm" class="flex flex-col sm:flex-row gap-3 items-start sm:items-center">
          <input
            id="csvFile"
            type="file"
            accept=".csv"
            class="block w-full sm:w-auto text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-700"
            required
          />
          <button
            id="uploadButton"
            type="submit"
            class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg"
          >
            Upload
          </button>
        </form>
        <p id="uploadMessage" class="text-sm"></p>
      </section>

      <section class="bg-white rounded-xl shadow p-6 space-y-4">
        <h2 class="text-lg font-semibold">2) Track Status</h2>
        <div class="flex flex-col sm:flex-row gap-3">
          <input
            id="jobIdInput"
            type="text"
            placeholder="Paste job_id"
            class="border rounded-lg px-3 py-2 w-full"
          />
          <button id="statusButton" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-lg">
            Check Status
          </button>
        </div>
        <pre id="statusOutput" class="bg-slate-900 text-slate-100 rounded-lg p-4 text-sm overflow-x-auto min-h-16"></pre>
      </section>

      <section class="bg-white rounded-xl shadow p-6 space-y-4">
        <h2 class="text-lg font-semibold">3) Fetch Results</h2>
        <div class="flex flex-col sm:flex-row gap-3">
          <button id="resultButton" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2 px-4 rounded-lg">
            Get Results
          </button>
        </div>
        <pre id="resultOutput" class="bg-slate-900 text-slate-100 rounded-lg p-4 text-sm overflow-x-auto min-h-16"></pre>
      </section>
    </main>

    <script>
      const uploadForm = document.getElementById("uploadForm");
      const csvFile = document.getElementById("csvFile");
      const uploadMessage = document.getElementById("uploadMessage");
      const jobIdInput = document.getElementById("jobIdInput");
      const statusButton = document.getElementById("statusButton");
      const resultButton = document.getElementById("resultButton");
      const statusOutput = document.getElementById("statusOutput");
      const resultOutput = document.getElementById("resultOutput");

      const render = (node, payload) => {
        node.textContent = JSON.stringify(payload, null, 2);
      };

      uploadForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!csvFile.files.length) {
          uploadMessage.textContent = "Please choose a CSV file.";
          uploadMessage.className = "text-sm text-red-600";
          return;
        }

        const formData = new FormData();
        formData.append("file", csvFile.files[0]);

        uploadMessage.textContent = "Uploading...";
        uploadMessage.className = "text-sm text-slate-600";

        try {
          const response = await fetch("/jobs/upload", {
            method: "POST",
            body: formData,
          });
          const payload = await response.json();

          if (!response.ok) {
            throw new Error(payload.detail || "Upload failed");
          }

          jobIdInput.value = payload.job_id;
          uploadMessage.textContent = `Upload accepted. job_id: ${payload.job_id}`;
          uploadMessage.className = "text-sm text-green-700";
          render(statusOutput, payload);
        } catch (error) {
          uploadMessage.textContent = error.message;
          uploadMessage.className = "text-sm text-red-600";
        }
      });

      statusButton.addEventListener("click", async () => {
        const jobId = jobIdInput.value.trim();
        if (!jobId) {
          render(statusOutput, { error: "job_id is required" });
          return;
        }

        try {
          const response = await fetch(`/jobs/${jobId}/status`);
          const payload = await response.json();
          render(statusOutput, payload);
        } catch (error) {
          render(statusOutput, { error: error.message });
        }
      });

      resultButton.addEventListener("click", async () => {
        const jobId = jobIdInput.value.trim();
        if (!jobId) {
          render(resultOutput, { error: "job_id is required" });
          return;
        }

        try {
          const response = await fetch(`/jobs/${jobId}/results`);
          const payload = await response.json();
          render(resultOutput, payload);
        } catch (error) {
          render(resultOutput, { error: error.message });
        }
      });
    </script>
  </body>
</html>
